name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.0-rel)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is committed
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "pubspec.lock not found — commit it for reproducible builds"
            exit 1
          fi

      - name: Run build_runner (Drift codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # Build per-architecture split APKs (armeabi-v7a, arm64-v8a, x86_64)
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      # Build universal fat APK as a separate invocation
      # Temporarily disable splits so AGP emits a single APK
      - name: Build universal APK
        run: flutter build apk --release

      # Rename split APKs to human-readable names
      - name: Rename APKs
        run: |
          TAG=${{ inputs.tag }}
          APK_DIR=build/app/outputs/flutter-apk

          mv "${APK_DIR}/app-armeabi-v7a-release.apk" \
             "${APK_DIR}/wasurenagusa-${TAG}-armeabi-v7a.apk"

          mv "${APK_DIR}/app-arm64-v8a-release.apk" \
             "${APK_DIR}/wasurenagusa-${TAG}-arm64-v8a.apk"

          mv "${APK_DIR}/app-x86_64-release.apk" \
             "${APK_DIR}/wasurenagusa-${TAG}-x86_64.apk"

          mv "${APK_DIR}/app-release.apk" \
             "${APK_DIR}/wasurenagusa-${TAG}-universal.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/wasurenagusa-${{ inputs.tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/wasurenagusa-${{ inputs.tag }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/wasurenagusa-${{ inputs.tag }}-x86_64.apk
            build/app/outputs/flutter-apk/wasurenagusa-${{ inputs.tag }}-universal.apk
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
