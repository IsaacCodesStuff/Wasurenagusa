name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify pubspec.lock is committed
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "pubspec.lock not found — commit it for reproducible builds"
            exit 1
          fi

      - name: Run build_runner (Drift codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # Build per-architecture split APKs
      - name: Build split debug APKs
        run: flutter build apk --debug --split-per-abi

      # Build universal fat debug APK
      - name: Build universal debug APK
        run: flutter build apk --debug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: wasurenagusa-debug
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
